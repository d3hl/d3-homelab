---
- name: Prepare AAP image-mode hosts for the containerized installer
  hosts: aap_bootc
  become: true
  gather_facts: true

  tasks:
    - name: Assert supported OS family
      ansible.builtin.assert:
        that:
          - ansible_distribution == "RedHat"
          - ansible_distribution_major_version | int == 9
        fail_msg: "This homelab image-mode scope expects RHEL 9 bootc hosts."

    - name: Ensure hostname matches inventory FQDN
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Ensure AAP host entries exist
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} AAP IMAGE MODE HOSTS"
        block: |
          {% for host in aap_host_entries %}
          {{ host.ip }} {{ host.names | join(' ') }}
          {% endfor %}

    - name: Ensure baseline services are enabled and running
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - chronyd
        - firewalld
        - qemu-guest-agent
        - sshd

    - name: Keep SELinux enforcing
      ansible.posix.selinux:
        policy: targeted
        state: enforcing

    - name: Open role-specific firewall ports
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ aap_firewall_ports[aap_role] | default([]) }}"

    - name: Confirm Podman is available from the image
      ansible.builtin.command: podman --version
      changed_when: false

