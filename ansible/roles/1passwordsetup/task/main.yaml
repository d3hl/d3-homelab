---
- name: Install 1Password CLI
  ansible.builtin.get_url:
    url: "https://cache.agilebits.com/dist/1P/op2/pkg/v{{ op_version }}/op_linux_amd64_v{{ op_version }}.zip"
    dest: /tmp/op.zip
    mode: '0644'

- name: Extract 1Password CLI
  ansible.builtin.unarchive:
    src: /tmp/op.zip
    dest: /usr/local/bin/
    remote_src: true