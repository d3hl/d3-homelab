# AAP 2.6 containerized growth inventory template.
#
# Keep this tracked file secret-free. Copy it to the ignored local inventory
# before deployment:
#
#   cp ansible/inventory/inventory-growth.ini ansible/inventory/inventory-growth.local.ini
#
# Then provide real passwords through Ansible Vault, 1Password rendering, or
# another local secret mechanism.

[automationgateway]
aap.d3hl.site

[automationcontroller]
aap.d3hl.site

[automationhub]
aap.d3hl.site

[automationeda]
aap.d3hl.site

[database]
aap.d3hl.site

[all:vars]
ansible_connection=local

postgresql_admin_username=postgres
postgresql_admin_password='{{ vault_postgresql_admin_password }}'

bundle_install=true
bundle_dir='{{ lookup("ansible.builtin.env", "PWD") }}/bundle'

redis_mode=standalone

gateway_admin_password='{{ vault_gateway_admin_password }}'
gateway_pg_host=aap.d3hl.site
gateway_pg_password='{{ vault_gateway_pg_password }}'

controller_admin_password='{{ vault_controller_admin_password }}'
controller_pg_host=aap.d3hl.site
controller_pg_password='{{ vault_controller_pg_password }}'
controller_percent_memory_capacity=0.5

hub_admin_password='{{ vault_hub_admin_password }}'
hub_pg_host=aap.d3hl.site
hub_pg_password='{{ vault_hub_pg_password }}'
hub_seed_collections=false

eda_admin_password='{{ vault_eda_admin_password }}'
eda_pg_host=aap.d3hl.site
eda_pg_password='{{ vault_eda_pg_password }}'
