# AAP 2.5 Containerized Installation — Single Controller + Hub + External DB
# Topology: https://docs.redhat.com/en/documentation/red_hat_ansible_automation_platform/2.5/html/rpm_installation/assembly-platform-install-scenario
#
# Usage (from inside the extracted AAP installer bundle):
#   ./setup.sh -i /path/to/this/aap.ini
#
# Passwords below use Ansible Vault — encrypt with:
#   ansible-vault encrypt_string '<value>' --name '<var>'

[automationgateway]
10.10.10.60 ansible_user=d3

[automationcontroller]
10.10.10.61 ansible_user=d3

[automationhub]
10.10.10.62 ansible_user=d3

[database]
10.10.10.63 ansible_user=d3

[all:vars]
ansible_become=true
ansible_ssh_private_key_file=/home/d3/.ssh/d3ops

# ── Registry ─────────────────────────────────────────────────────────────────
# Red Hat registry credentials (registry.redhat.io)
# Get from https://access.redhat.com/terms-based-registry/
registry_url='registry.redhat.io'
registry_username='<rhn-username>'
registry_password='<rhn-password>'

# ── Admin passwords ───────────────────────────────────────────────────────────
admin_password='<gateway-admin-password>'
automationhub_admin_password='<hub-admin-password>'

# ── Redis ─────────────────────────────────────────────────────────────────────
redis_mode=standalone

# ── Shared PostgreSQL connection (controller database) ───────────────────────
pg_host='10.10.10.63'
pg_port='5432'
pg_database='awx'
pg_username='awx'
pg_password='<controller-db-password>'
pg_sslmode='prefer'

# ── Hub PostgreSQL connection ─────────────────────────────────────────────────
automationhub_pg_host='10.10.10.63'
automationhub_pg_port=5432
automationhub_pg_database='automationhub'
automationhub_pg_username='automationhub'
automationhub_pg_password='<hub-db-password>'
automationhub_pg_sslmode='prefer'

# ── Gateway PostgreSQL connection ─────────────────────────────────────────────
# automationgateway_pg_host='10.10.10.63'
# automationgateway_pg_port=5432
# automationgateway_pg_database='gateway'
# automationgateway_pg_username='gateway'
# automationgateway_pg_password='<gateway-db-password>'

# ── TLS ───────────────────────────────────────────────────────────────────────
# Defaults to self-signed. Set paths to use your own certs.
# automationhub_ssl_cert=/path/to/hub.crt
# automationhub_ssl_key=/path/to/hub.key
# automationhub_disable_https=False
# automationhub_ssl_validate_certs=False

# ── Receptor / mesh ──────────────────────────────────────────────────────────
# receptor_listener_port=27199

# ── Optional: generate installer token for Authentik/Dex SSO later ──────────
# automationcontroller_extra_settings:
#   - setting: SOCIAL_AUTH_OIDC_KEY
#     value: 'aap'
